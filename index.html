s.pts.map((p,j)=>e("circle",{key:j,cx:sx(p.x),cy:sy(p.y),r:hl===s.id?4:3,fill:s.col,stroke:"#006B54",strokeWidth:1.5})),
hl===s.id&&s.pts.map((p,j)=>e("text",{key:"v"+j,x:sx(p.x),y:sy(p.y)-8,textAnchor:"middle",fontSize:9,fontWeight:700,fill:s.col,fontFamily:"Georgia,serif"},p.y))))),
e("div",{style:{fontSize:9,color:"rgba(255,255,255,.35)",textAlign:"center",margin:"4px 0 12px",letterSpacing:1}},"Weiter oben = besseres Handicap · Namen antippen zum Hervorheben"),

syms.forEach(sy=>{const t=(sy.text||"").replace(/[^0-9]/g,"");if(!t)return;const cx=(sy.bbox.x0+sy.bbox.x1)/2;const k=slots.findIndex(s=>cx>=s[0]&&cx<s[1]);if(k>=0)acc[k]+=t});

/* Prüfhinweise für den Abgleich */
function checks(){
